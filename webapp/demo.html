<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>交互演示 · Mini Tomcat</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .demo { margin-top: 2rem; }
    .btn {
      background: var(--card);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn:hover {
      background: var(--accent);
      color: var(--bg);
    }
    #output {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--card);
      border-radius: 6px;
      min-height: 3rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>交互演示</h1>
      <p class="subtitle">JavaScript 由静态资源服务器提供</p>
    </header>

    <section class="demo">
      <button class="btn" id="toggle">点击切换</button>
      <div id="output">等待点击...</div>
    </section>

    <a href="index.html" class="links" style="margin-top: 2rem;">← 返回首页</a>
  </div>
  <script>
    const btn = document.getElementById('toggle');
    const out = document.getElementById('output');
    let state = false;
    btn.addEventListener('click', function() {
      state = !state;
      out.textContent = state ? '✓ 静态 JS 执行成功' : '等待点击...';
      out.style.color = state ? 'var(--accent)' : 'var(--muted)';
    });
  </script>
</body>
</html>
