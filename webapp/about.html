<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于 · Mini Tomcat</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .about { margin-top: 2rem; }
    .about h2 { font-size: 1.25rem; color: var(--accent); margin-bottom: 0.75rem; }
    .about p { margin-bottom: 1rem; color: var(--muted); }
    .back { display: inline-block; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>关于 Mini Tomcat</h1>
      <p class="subtitle">模拟 Tomcat 架构的轻量级 Web 服务器</p>
    </header>

    <section class="about">
      <h2>架构组件</h2>
      <p>Server → Service → Connector + Engine → Host → Context → Wrapper → Servlet</p>
      <h2>静态资源</h2>
      <p>Context 的 docBase 指向 webapp 目录，DefaultServlet 从该目录提供 HTML、CSS、JS、图片等静态文件。</p>
      <h2>MIME 类型</h2>
      <p>支持 html、css、js、json、png、jpg、gif、ico、svg 等常见类型的自动识别。</p>
    </section>

    <a href="index.html" class="links back">← 返回首页</a>
  </div>
</body>
</html>
